<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  
  <!-- Center composition -->
  <g transform="translate(800, 450) scale(1.1)">
    <!-- Laptop/PC outline -->
    <rect x="-200" y="-140" width="400" height="280" rx="12" fill="#0f0f1a" stroke="#3a3a5e" stroke-width="3"/>
    <rect x="-180" y="-120" width="360" height="220" rx="6" fill="#0a0a1a"/>
    
    <!-- Screen content: Windows logo + "No keyboard" -->
    <g transform="translate(0, -10)">
      <!-- Windows logo -->
      <g transform="translate(-40, -30)">
        <rect x="0" y="0" width="32" height="32" rx="4" fill="#0078d4"/>
        <rect x="40" y="0" width="32" height="32" rx="4" fill="#0078d4"/>
        <rect x="0" y="40" width="32" height="32" rx="4" fill="#0078d4"/>
        <rect x="40" y="40" width="32" height="32" rx="4" fill="#0078d4"/>
      </g>
      
      <!-- Exclamation mark -->
      <circle cx="0" cy="40" r="30" fill="#ff4444" opacity="0.2"/>
      <text x="0" y="50" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#ff4444" text-anchor="middle">!</text>
      
      <!-- "No Keyboard" text -->
      <text x="0" y="90" font-family="system-ui, sans-serif" font-size="18" fill="#aaaaaa" text-anchor="middle">No Keyboard Detected</text>
    </g>
    
    <!-- Keyboard below laptop -->
    <g transform="translate(0, 160) scale(0.9)">
      <rect x="-160" y="0" width="320" height="80" rx="8" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="2"/>
      <g fill="#2a2a4e" stroke="#3a3a5e" stroke-width="1">
        <g transform="translate(-140, 10)">
          <rect x="0" y="0" width="40" height="40" rx="4"/>
          <rect x="48" y="0" width="40" height="40" rx="4" opacity="0.3"/>
          <rect x="96" y="0" width="40" height="40" rx="4"/>
          <rect x="144" y="0" width="40" height="40" rx="4"/>
          <rect x="192" y="0" width="40" height="40" rx="4"/>
        </g>
        <g transform="translate(-130, 60)">
          <rect x="0" y="0" width="40" height="40" rx="4"/>
          <rect x="48" y="0" width="40" height="40" rx="4" opacity="0.3"/>
          <rect x="96" y="0" width="40" height="40" rx="4"/>
          <rect x="144" y="0" width="40" height="40" rx="4"/>
        </g>
        <g transform="translate(-110, 110)">
          <rect x="0" y="0" width="40" height="40" rx="4"/>
          <rect x="48" y="0" width="40" height="40" rx="4" opacity="0.3"/>
          <rect x="96" y="0" width="40" height="40" rx="4"/>
        </g>
        <rect x="-20" y="160" width="120" height="40" rx="4" fill="#2a2a4e" stroke="#3a3a5e" stroke-width="1" opacity="0.3"/>
      </g>
      
      <!-- Red X over keyboard -->
      <line x1="-80" y1="40" x2="80" y2="160" stroke="#ff4444" stroke-width="6" stroke-linecap="round"/>
      <line x1="80" y1="40" x2="-80" y2="160" stroke="#ff4444" stroke-width="6" stroke-linecap="round"/>
    </g>
    
    <!-- USB cable disconnected -->
    <g transform="translate(180, 50)">
      <path d="M0,0 Q20,-10 40,0 Q60,10 80,0" stroke="#0078d4" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="80" cy="0" r="12" fill="#ff4444"/>
      <line x1="72" y1="-8" x2="88" y2="8" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <line x1="88" y1="-8" x2="72" y2="8" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Title text -->
  <text x="800" y="780" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Keyboard Not Detected</text>
  <text x="800" y="830" font-family="system-ui, sans-serif" font-size="20" fill="#aaaaaa" text-anchor="middle">Keyboard Tidak Terdeteksi di Windows? Ini Cara Mengatasinya</text>
</svg>