<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  
  <!-- Keyboard outline -->
  <g transform="translate(800, 450) scale(1.2)">
    <!-- Keyboard base -->
    <rect x="-280" y="-100" width="560" height="200" rx="16" fill="#0f0f1a" stroke="#3a3a5e" stroke-width="3"/>
    <rect x="-260" y="-80" width="520" height="160" rx="8" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="1"/>
    
    <!-- Key rows -->
    <g fill="#2a2a4e" stroke="#3a3a5e" stroke-width="1.5">
      <!-- Row 1: number row -->
      <g transform="translate(-240, -60)">
        <rect x="0" y="0" width="48" height="48" rx="6"/>
        <rect x="56" y="0" width="48" height="48" rx="6" filter="url(#glow)" fill="#ff4444" stroke="#ff6666"/>
        <rect x="112" y="0" width="48" height="48" rx="6"/>
        <rect x="168" y="0" width="48" height="48" rx="6"/>
        <rect x="224" y="0" width="48" height="48" rx="6"/>
        <rect x="280" y="0" width="48" height="48" rx="6"/>
        <rect x="336" y="0" width="48" height="48" rx="6"/>
        <rect x="392" y="0" width="48" height="48" rx="6"/>
        <rect x="448" y="0" width="48" height="48" rx="6"/>
      </g>
      
      <!-- Row 2: QWERTY -->
      <g transform="translate(-220, -4)">
        <rect x="0" y="0" width="48" height="48" rx="6"/>
        <rect x="56" y="0" width="48" height="48" rx="6" filter="url(#glow)" fill="#ff4444" stroke="#ff6666"/>
        <rect x="112" y="0" width="48" height="48" rx="6"/>
        <rect x="168" y="0" width="48" height="48" rx="6"/>
        <rect x="224" y="0" width="48" height="48" rx="6"/>
        <rect x="280" y="0" width="48" height="48" rx="6"/>
        <rect x="336" y="0" width="48" height="48" rx="6"/>
        <rect x="392" y="0" width="48" height="48" rx="6"/>
        <rect x="448" y="0" width="48" height="48" rx="6"/>
      </g>
      
      <!-- Row 3: ASDF -->
      <g transform="translate(-200, 52)">
        <rect x="0" y="0" width="48" height="48" rx="6"/>
        <rect x="56" y="0" width="48" height="48" rx="6" filter="url(#glow)" fill="#ff4444" stroke="#ff6666"/>
        <rect x="112" y="0" width="48" height="48" rx="6"/>
        <rect x="168" y="0" width="48" height="48" rx="6"/>
        <rect x="224" y="0" width="48" height="48" rx="6"/>
        <rect x="280" y="0" width="48" height="48" rx="6"/>
        <rect x="336" y="0" width="48" height="48" rx="6"/>
      </g>
      
      <!-- Row 4: ZXCV -->
      <g transform="translate(-180, 108)">
        <rect x="0" y="0" width="48" height="48" rx="6"/>
        <rect x="56" y="0" width="48" height="48" rx="6" filter="url(#glow)" fill="#ff4444" stroke="#ff6666"/>
        <rect x="112" y="0" width="48" height="48" rx="6"/>
        <rect x="168" y="0" width="48" height="48" rx="6"/>
        <rect x="224" y="0" width="48" height="48" rx="6"/>
        <rect x="280" y="0" width="48" height="48" rx="6"/>
      </g>
      
      <!-- Spacebar -->
      <rect x="-100" y="164" width="200" height="48" rx="6" fill="#2a2a4e" stroke="#3a3a5e" stroke-width="1.5"/>
    </g>
    
    <!-- Double input indicator: two "a" characters floating from the red key -->
    <g transform="translate(-20, -120)" opacity="0.9">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#ff4444" text-anchor="middle">aa</text>
      <text x="0" y="-35" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffaa00" text-anchor="middle">⚡</text>
    </g>
    
    <!-- Arrow showing double -->
    <g transform="translate(180, -120)" opacity="0.8">
      <path d="M0,0 L30,-15 M0,0 L30,15 M30,-15 L30,15" stroke="#ffaa00" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="50" y="5" font-family="system-ui, sans-serif" font-size="20" fill="#ffaa00" text-anchor="start">Double Input</text>
    </g>
  </g>
  
  <!-- Title text -->
  <text x="800" y="780" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Double Input Fix</text>
  <text x="800" y="830" font-family="system-ui, sans-serif" font-size="22" fill="#aaaaaa" text-anchor="middle">Cara Mengatasi Keyboard Mechanical Double Input</text>
</svg>